<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Speakio — AI ile İngilizce öğren">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="learna-ui.css?v=20">
<title>Speakio — AI English Tutor</title>
</head>
<body>
<div class="app-shell"><div id="app"><div class="boot"><div class="boot-logo">S</div><b>Speakio</b><span>AI İngilizce öğretmenin hazırlanıyor…</span></div></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(function(){
  if(sessionStorage.getItem('speakio-cache-reset')==='1')return;
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).then(()=>{
      if(window.caches)return caches.keys().then(keys=>Promise.all(keys.filter(k=>/^speakio-/i.test(k)).map(k=>caches.delete(k))));
    }).then(()=>{sessionStorage.setItem('speakio-cache-reset','1');location.replace('/?fresh='+Date.now());}).catch(()=>{});
  }
})();
</script>
<script src="content/content-loader.js?v=20"></script>
<script src="runtime-fixes.js?v=20"></script>
<script src="build-fix.js?v=20"></script>
<script src="course-system.js?v=20"></script>
<script src="app.js?v=20"></script>
<script src="premium.js?v=20"></script>
<script src="premium-ui.js?v=20"></script>
<script src="learna-ui.js?v=20"></script>
<script>window.addEventListener('speakio:content-ready',()=>window.Speakio?.render?.());</script>
</body>
</html>
