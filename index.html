<div class="app-shell"><div id="app"><div class="boot"><div class="boot-logo">S</div><b>Speakio</b><span>AI İngilizce öğretmenin hazırlanıyor…</span></div></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
 'use strict';
 const KEY='speakio_pwa_reset_v31';
 if(!('serviceWorker' in navigator))return;
 const controlled=!!navigator.serviceWorker.controller;
 Promise.resolve().then(async()=>{
   try{
     const regs=await navigator.serviceWorker.getRegistrations();
     await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));
     const keys=await caches.keys();
     await Promise.all(keys.map(k=>caches.delete(k)));
   }catch(e){console.warn('Speakio PWA reset',e)}
   if(controlled&&!sessionStorage.getItem(KEY)){
     sessionStorage.setItem(KEY,'1');
     location.reload();
     return;
   }
   sessionStorage.removeItem(KEY);
 });
})();
</script>
