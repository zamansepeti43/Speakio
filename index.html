function bottom(active){return `<nav class="bottom"><button class="${active==='home'?'active':''}" onclick="nav('home')"><span class="bi">⌂</span>Ana Sayfa</button><button class="${active==='lessons'?'active':''}" onclick="nav('lessons')"><span class="bi">▣</span>Dersler</button><button class="${active==='discover'?'active':''}" onclick="nav('discover')"><span class="bi">⌕</span>Keşfet</button><button class="${active==='profile'?'active':''}" onclick="nav('profile')"><span class="bi">◉</span>Profil</button></nav>`}
function header(title,back='home',right=''){return `<div class="header"><button class="icon" onclick="nav('${back}')">‹</button><h1>${title}</h1><span>${right}</span></div>`}
function home(){return `<div class="screen"><div class="head"><div><h2>Merhaba ${esc(state.name)} 👋</h2><p class="muted">Bugün öğrenmeye devam edelim!</p></div><div class="avatar">${initials()}</div></div><div class="stats"><div class="stat"><span>🔥</span><b>${state.streak}</b><small>gün seri</small></div><div class="stat"><span>⭐</span><b>${state.xp.toLocaleString('tr-TR')}</b><small>XP</small></div><div class="stat"><span>🏆</span><b>${state.level}</b><small>Seviye</small></div></div><div class="card"><div class="row"><b>Günlük Hedef</b><small>${Math.min(state.goal,Math.max(0,state.completed.length%4))}/3 ders</small></div><div class="progress"><i style="width:${Math.min(100,Math.max(15,(state.completed.length%4)/3*100))}%"></i></div></div><div class="section"><h3>Bugünün Dersi</h3><button class="link" onclick="nav('lessons')">Tümünü Gör</button></div><div class="lesson"><div class="lessonicon">${course()[Math.min(state.completed.length,course().length-1)].icon}</div><div class="grow"><b>${course()[Math.min(state.completed.length,course().length-1)].title}</b><small>${course()[Math.min(state.completed.length,course().length-1)].sub}</small></div><button class="primary small" onclick="startLesson(${course()[Math.min(state.completed.length,course().length-1)].id})">Devam Et</button></div><div class="section"><h3>Hızlı Pratik</h3></div><div class="grid"><button class="feature" onclick="nav('speak')"><div class="ico">🎙️</div><b>AI Speak</b><small>Konuşma pratiği</small></button><button class="feature" onclick="nav('words')"><div class="ico">📖</div><b>Kelime Hafızası</b><small>${state.savedWords.length} kayıtlı kelime</small></button><button class="feature" onclick="nav('listen')"><div class="ico">🎧</div><b>Dinleme</b><small>Ses alıştırmaları</small></button><button class="feature" onclick="nav('grammar')"><div class="ico">📘</div><b>Dil Bilgisi</b><small>Kısa ve net</small></button></div><div class="section"><h3>İlerlemen</h3><button class="link" onclick="nav('profile')">Profil</button></div><div class="card"><div class="row"><span>İngilizce A1</span><b>${pct()}%</b></div><div class="progress"><i style="width:${pct()}%"></i></div><p class="muted" style="margin-top:8px">${state.completed.length} ders tamamlandı · ${Math.max(0,12-state.completed.length)} ders kaldı</p></div>${bottom('home')}</div>`}
function lessons(){const c=course();return `<div class="screen">${header('İngilizce '+state.level,'home','📷')}<div class="tabs"><button class="sel">Kurs Haritası</button><button onclick="toast('Yakında tüm dersler görünümü')">Tüm Dersler</button></div>${c.map((l,i)=>{const done=state.completed.includes(l.id),unlocked=i===0||state.completed.includes(c[i-1].id);return `<div class="map ${done?'done':''} ${unlocked&&!done?'current':''} ${!unlocked?'lock':''}"><div class="node">${done?'✓':unlocked?'●':'🔒'}</div><div class="grow"><b style="font-size:12px">${i+1}. ${l.title}</b><small class="muted">${l.sub} · ${l.xp} XP</small></div>${unlocked?`<button class="tag" onclick="startLesson(${l.id})">${done?'Tekrar':'Başla'}</button>`:`<span class="tag">Kilitli</span>`}</div>`}).join('')}<div class="card"><div class="row"><b>A1 ilerlemesi</b><b>${pct()}%</b></div><div class="progress"><i style="width:${pct()}%"></i></div><p class="muted" style="margin-top:8px">Her dersi tamamladığında yeni konu açılır.</p></div>${bottom('lessons')}</div>`}
function startLesson(id){lessonId=id;lessonStep=0;selectedAnswer=null;page='lesson';render()}
function lesson(){const l=findLesson(lessonId);const item=l.items[lessonStep];const options=[item[1],...(l.items.filter((_,i)=>i!==lessonStep).slice(0,2).map(x=>x[1]))].sort(()=>Math.random()-.5);return `<div class="screen">${header(l.title,'lessons',`${lessonStep+1}/${l.items.length}`)}<div class="progress"><i style="width:${((lessonStep)/l.items.length)*100}%"></i></div><div class="lessonbox"><p class="muted">Türkçesini gör ve doğru İngilizce ifadeyi seç.</p><div class="question">“${item[0]}”</div>${options.map(o=>`<button class="answer ${selectedAnswer===o?(o===item[1]?'correct':'wrong'):''}" onclick="answer('${attr(o)}','${attr(item[1])}')">${o}</button>`).join('')}<button class="secondary full" onclick="speak('${attr(item[1])}')">🔊 Dinle</button></div>${selectedAnswer?`<button class="primary full" onclick="nextLesson()">${lessonStep===l.items.length-1?'Dersi Tamamla':'Devam Et'} →</button>`:''}</div>`}
function answer(a,c){if(selectedAnswer)return;selectedAnswer=a;if(a===c){state.xp+=10;toast('Doğru! +10 XP ⭐')}else toast('Yaklaştın, doğru cevap yeşil ile gösterildi');save();render()}
function nextLesson(){const l=findLesson(lessonId);if(lessonStep<l.items.length-1){lessonStep++;selectedAnswer=null;render();return}if(!state.completed.includes(l.id))state.completed.push(l.id);state.xp+=l.xp;save();page='result';render()}
function result(){const l=findLesson(lessonId);return `<div class="screen">${header('Ders Tamamlandı','lessons','✓')}<div class="xpbox"><span style="font-size:50px">🎉</span><h2>Harika!</h2><strong>+${l.xp+40} XP</strong><p class="muted">${l.title} tamamlandı.</p></div><div class="result"><div class="resulttop"><div class="resultavatar">👩🏻‍🏫</div><div><b>Maya</b><div class="good">Mükemmel ilerleme!</div></div></div><p class="correction">Bugün öğrendiklerini konuşmada kullanmayı unutma. Bir sonraki konu artık açık.</p></div><button class="primary full" onclick="nav('lessons')">Kursa Devam Et</button><button class="secondary full" onclick="nav('speak')">🗣️ Şimdi Konuş</button></div>`}
function speakPage(){return `<div class="screen">${header('AI Speak','home','⚙')}<div class="practice"><div class="person">👩🏻‍🏫</div><div class="bubble"><b>Maya</b><br>${chatMessages[chatMessages.length-1][1]}</div></div><button id="mic" class="mic" onclick="toggleMic()">🎙️</button><p class="muted" style="text-align:center">Konuşmak için dokun</p><div class="tools" style="margin-top:15px"><span onclick="toast('Klavyeden yazarak da cevap verebilirsin')"><b>⌨️</b>Klavye</span><span onclick="speak(chatMessages[chatMessages.length-1][1])"><b>🔊</b>Dinle</span><span onclick="toast('İpucu: kısa ve basit bir cümle kur')"><b>💡</b>İpucu</span></div><div class="chat" style="min-height:auto;margin-top:16px"><div class="messages" id="chatmsgs">${chatMessages.map(m=>`<div class="msg ${m[0]==='ai'?'ai':'me'}">${esc(m[1])}</div>`).join('')}</div><div class="chatinput"><input id="chattext" placeholder="İngilizce cevap yaz..." onkeydown="if(event.key==='Enter')sendChat()"><button onclick="sendChat()">➤</button></div></div></div>`}
let recognition=null;function toggleMic(){if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){toast('Bu tarayıcı ses tanımayı desteklemiyor');return}if(recognition){recognition.stop();recognition=null;return}const R=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new R();recognition.lang='en-US';recognition.interimResults=false;recognition.onstart=()=>{document.getElementById('mic')?.classList.add('listening');toast('Dinliyorum...')};recognition.onresult=e=>{const t=e.results[0][0].transcript;document.getElementById('chattext').value=t;sendChat()};recognition.onerror=()=>toast('Ses anlaşılmadı, tekrar deneyelim');recognition.onend=()=>{recognition=null;document.getElementById('mic')?.classList.remove('listening')};recognition.start()}
function sendChat(){const el=document.getElementById('chattext');if(!el||!el.value.trim())return;const t=el.value.trim();chatMessages.push(['me',t]);const reply=coachReply(t);chatMessages.push(['ai',reply]);state.conversations++;state.xp+=5;save();render();setTimeout(()=>speak(reply),80)}
function coachReply(t){const x=t.toLowerCase();if(x.includes('work')||x.includes('job'))return 'Nice! You can say: “I work in a factory.” What do you do after work?';if(x.includes('family')||x.includes('wife')||x.includes('son'))return 'Great! Try: “I have a family.” Who do you live with?';if(x.includes('good')||x.includes('fine'))return 'That is great to hear! Tell me one thing you did today.';if(x.includes('hello')||x.includes('hi'))return 'Hello! 😊 Let’s practice. Where are you from?';return 'Good job! I understood you. Try to answer with one full sentence: “I am …”';}
function wordsPage(){const w=words[wordIndex%words.length],saved=state.savedWords.includes(w[0]);return `<div class="screen">${header('Kelime Hafızası','home','⚙')}<div class="card"><div class="row"><span>Bugünkü kelimeler</span><b>${(wordIndex%10)+1}/10</b></div><div class="progress"><i style="width:${((wordIndex%10)+1)*10}%"></i></div></div><div class="word"><div class="wordemoji">${w[3]}</div><h2>${w[0]}</h2><div class="pron">${w[1]}</div><div class="meaning">${w[2]}</div><div class="wordactions"><button class="circle" onclick="speak('${w[0]}')">🔊</button><button class="circle" onclick="saveWord('${w[0]}')">${saved?'⭐':'☆'}</button></div></div><button class="primary full" onclick="nextWord()">Biliyorum ✓</button><button class="secondary full" onclick="speak('${w[0]}')">Tekrar Dinle</button><p class="muted" style="text-align:center;margin-top:12px">Kelimeyi cümle içinde de söyle: “I like this ${w[0]}.”</p></div>`}
function nextWord(){wordIndex++;state.xp+=3;save();render();toast('+3 XP')}function saveWord(w){if(!state.savedWords.includes(w)){state.savedWords.push(w);state.xp+=5;toast('Kelime hafızaya eklendi ⭐')}else{state.savedWords=state.savedWords.filter(x=>x!==w);toast('Kelime kaldırıldı')}save();render()}
function listenPage(){const q=listening[listenIndex%listening.length];return `<div class="screen">${header('Dinleme Alıştırması','home',`${(listenIndex%5)+1}/5`)}<div class="listen"><h3>Duyduğun kelimeyi seç</h3><button class="audio" onclick="speak('${q[0]}')">🔊</button>${q[2].map(o=>`<button class="choice ${selectedAnswer===o?(o===q[0]?'selected':'wrong'):''}" onclick="listenAnswer('${o}','${q[0]}')">${o}</button>`).join('')}</div>${selectedAnswer?`<button class="primary full" onclick="nextListen()">Devam Et →</button>`:`<p class="muted" style="text-align:center;margin-top:12px">Sesi birkaç kez dinleyebilirsin.</p>`}</div>`}
function listenAnswer(a,c){if(selectedAnswer)return;selectedAnswer=a;if(a===c){state.xp+=12;state.listeningDone++;toast('Doğru! +12 XP')}else toast('Tekrar dinle ve dene');save();render()}function nextListen(){listenIndex++;selectedAnswer=null;render()}
function grammar(){const cards=[['am / is / are','I am happy. / She is happy. / They are happy.','“be” fiilini özneye göre değiştir.'],['have / has','I have a car. / He has a car.','He, she, it ile “has” kullan.'],['do / does','Do you work? / Does he work?','Soru cümlelerinde yardımcı fiil kullan.'],['Simple Present','I work every day.','Rutinleri anlatırken geniş zaman kullan.'],['Past Simple','I worked yesterday.','Düzenli fiillerde geçmiş zaman için -ed kullan.']];return `<div class="screen">${header('Dil Bilgisi','home')}<p class="muted">Kuralı öğren, hemen cümle içinde kullan.</p>${cards.map(c=>`<div class="card"><h3 style="font-size:14px">${c[0]}</h3><p style="font-size:12px;margin:8px 0;color:#dce9ef">${c[1]}</p><p class="muted">${c[2]}</p><button class="secondary small" style="margin-top:10px" onclick="speak('${attr(c[1])}')">🔊 Örneği Dinle</button></div>`).join('')}</div>`}
function achievements(){const a=[['🔥','7 Gün Seri','7 gün üst üste öğren','ok'],['⭐','İlk Ders','İlk dersi tamamla',state.completed.length?'ok':'lock'],['📖','Kelime Ustası','10 kelime kaydet',state.savedWords.length>=10?'ok':'lock'],['🗣️','Konuşmacı','10 konuşma yap',state.conversations>=10?'ok':'lock'],['🎧','Dinleme Uzmanı','20 alıştırma',state.listeningDone>=20?'ok':'lock'],['🚀','Seviye Atla','A2’ye ulaş',state.level==='A2'?'ok':'lock'],['☀️','Erken Başlayan','Sabah pratik yap','lock'],['🏆','5000 XP','5000 XP kazan','lock'],['💎','Mükemmel Ders','Hatasız ders','lock']];return `<div class="screen">${header('Başarılar','home')}<div class="achgrid">${a.map(x=>`<div class="achievement ${x[3]==='lock'?'lockedbadge':''}"><div class="badge">${x[0]}</div><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div><div class="card" style="margin-top:16px"><div class="row"><b>Hedefin</b><span>${state.completed.length}/12 ders</span></div><div class="progress"><i style="width:${pct()}%"></i></div></div></div>`}
function profile(){const bars=state.week;return `<div class="screen">${header('Profil','home','⚙')}<div class="profilehead"><div class="bigavatar">${initials()}</div><div class="profileinfo"><h2>${esc(state.name)}</h2><p class="muted">İngilizce öğreniyor</p></div><span class="level">${state.level}</span></div><div class="stats"><div class="stat"><span>🔥</span><b>${state.streak}</b><small>gün seri</small></div><div class="stat"><span>⭐</span><b>${state.xp.toLocaleString('tr-TR')}</b><small>XP</small></div><div class="stat"><span>✓</span><b>${state.completed.length}</b><small>ders</small></div></div><div class="profilecard"><div class="row"><b>Haftalık ilerleme</b><span class="muted">XP</span></div><div class="bars">${bars.map((v,i)=>`<div class="bar" style="height:${Math.max(12,v*22)}px"><small>${['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'][i]}</small></div>`).join('')}</div></div><button class="profileline" onclick="nav('words')"><span>📖</span><b>Kelimelerim</b><small>${state.savedWords.length} kelime</small><span class="chev">›</span></button><button class="profileline" onclick="nav('achievements')"><span>🏆</span><b>Başarılar</b><small>Rozetlerini gör</small><span class="chev">›</span></button><button class="profileline" onclick="nav('settings')"><span>⚙️</span><b>Ayarlar</b><small>Tercihler</small><span class="chev">›</span></button>${bottom('profile')}</div>`}
function discover(){return `<div class="screen">${header('Keşfet','home')}<div class="welcome"><div class="globe">🌍</div><h2>Dünyayı konuş</h2><p>Gerçek hayattaki durumlar için hazır konuşma senaryolarını dene.</p></div><div class="section"><h3>Konuşma Senaryoları</h3></div><div class="topicgrid">${scenarios.map((s,i)=>`<button class="topic" onclick="startScenario(${i})"><span>${s[0]}</span><b>${s[1]}</b><div class="muted" style="margin-top:5px">${s[2]}</div></button>`).join('')}</div><div class="section"><h3>Seviyeler</h3></div><div class="card"><div class="row"><b>A1 · Başlangıç</b><span class="pill">${state.completed.length}/12</span></div><div class="progress"><i style="width:${pct()}%"></i></div></div><div class="card"><div class="row"><b>A2 · Temel Orta</b><span class="pill">${state.level==='A2'?'3/3':'Kilitli'}</span></div><p class="muted" style="margin-top:7px">A1 kursunu tamamlayınca açılır.</p></div></div>`}
function startScenario(i){const s=scenarios[i];chatMessages=[['ai',`Welcome to ${s[1]}! ${s[2]}. Let’s start. What would you like to say?`]];page='speak';render()}
function settings(){return `<div class="screen">${header('Ayarlar','home')}<div class="setting"><span>🔊</span><b>Sesler</b><button class="toggle ${state.sound?'on':''}" onclick="toggleSetting('sound')"></button></div><div class="setting"><span>🤖</span><b>Otomatik seslendirme</b><button class="toggle ${state.auto?'on':''}" onclick="toggleSetting('auto')"></button></div><div class="setting"><span>👤</span><b>Profil adı</b><button class="secondary small" onclick="changeName()">${esc(state.name)}</button></div><div class="setting"><span>🌍</span><b>Öğrenme dili</b><small>İngilizce</small></div><div class="setting"><span>🎯</span><b>Günlük hedef</b><small>3 ders</small></div><div class="section"><h3>Uygulama</h3></div><button class="danger full" onclick="resetProgress()">İlerlemeyi Sıfırla</button><p class="muted" style="text-align:center;margin-top:15px">Speakio v1.0 · Yerel çalışan MVP</p></div>`}
function toggleSetting(k){state[k]=!state[k];save();render();toast(state[k]?'Açıldı':'Kapatıldı')}
function changeName(){const n=prompt('Yeni adın:',state.name);if(n&&n.trim()){state.name=n.trim().slice(0,20);save();render();toast('Profil güncellendi')}}function resetProgress(){if(confirm('Tüm ilerleme silinsin mi?')){localStorage.removeItem('speakio_state');location.reload()}}
function onboarding(){return `<div class="onboard"><div class="logo"><span>◖▮◗</span></div><h1>Speakio</h1><p>Konuşarak dil öğren.<br>Her gün biraz daha akıcı.</p><div class="form"><label>Adın</label><input id="oname" value="${esc(state.name)}" maxlength="20"><label>Öğrenmek istediğin dil</label><select><option>🇬🇧 İngilizce</option></select><button class="primary full" onclick="finishOnboard()">Başla 🚀</button></div></div>`}
function finishOnboard(){const n=document.getElementById('oname').value.trim();if(n)state.name=n;state.first=false;save();render()}
function findLesson(id){return [...curriculum.A1,...curriculum.A2].find(x=>x.id===id)||curriculum.A1[0]}
function initials(){return (state.name||'A').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function attr(s){return esc(s).replace(/`/g,'&#96;')}
function render(){const root=document.getElementById('root');if(state.first){root.innerHTML=onboarding();return}let html=page==='home'?home():page==='lessons'?lessons():page==='lesson'?lesson():page==='result'?result():page==='speak'?speakPage():page==='words'?wordsPage():page==='listen'?listenPage():page==='grammar'?grammar():page==='achievements'?achievements():page==='profile'?profile():page==='discover'?discover():page==='settings'?settings():home();root.innerHTML=html;if(state.auto&&page==='lesson'&&lessonId&&lessonStep===0){const l=findLesson(lessonId);setTimeout(()=>speak(l.items[0][1]),250)}}
document.getElementById('clock').textContent=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}),30000);render();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body></html>
