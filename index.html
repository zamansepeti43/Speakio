<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06121f">
<meta name="description" content="Speakio — Konuşarak Dil Öğren">
<title>Speakio</title>
<style>
:root{--bg:#02070c;--panel:#071521;--panel2:#0b2030;--line:#193448;--text:#f6fbff;--muted:#8294a5;--cyan:#2ee0e9;--green:#20dfa4;--blue:#237cff;--purple:#7655ff;--danger:#ff647c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#01050a;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex;justify-content:center;background:radial-gradient(circle at 50% -10%,#102c43,#02070c 48%)}.phone{width:100%;max-width:430px;min-height:100vh;background:linear-gradient(180deg,#06121f,#03101a);position:relative}.status{height:31px;padding:9px 18px 0;font-size:11px;display:flex;justify-content:space-between;color:#c8d5e0}.screen{padding:14px 18px 94px;min-height:calc(100vh - 31px)}h1,h2,h3,p{margin-top:0}.head,.row,.section,.lesson,.profile{display:flex;align-items:center}.head{justify-content:space-between;margin:8px 0 18px}.head h2{font-size:20px;margin:0 0 5px}.muted{color:var(--muted);font-size:11px}.avatar,.big-avatar{border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#18d5e9,#704dff);font-weight:800}.avatar{width:42px;height:42px}.big-avatar{width:64px;height:64px;font-size:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat,.card,.lesson,.feature,.word,.listen,.profile-row,.hero,.topic,.chat,.setting{background:linear-gradient(145deg,#0b2030,#071521);border:1px solid var(--line);box-shadow:inset 0 1px #fff1}.stat{border-radius:13px;padding:10px;text-align:center}.stat b{display:block;font-size:15px;margin:4px}.stat small{font-size:9px;color:#8498a9}.card{padding:14px;border-radius:15px;margin:13px 0}.row{justify-content:space-between;font-size:12px}.progress{height:7px;border-radius:20px;background:#152b3b;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:20px}.section{justify-content:space-between;margin:14px 0 9px}.section h3{font-size:14px;margin:0}.link{border:0;background:none;color:#67d9ff;font-size:10px}.lesson{padding:10px;border-radius:15px;gap:10px;margin-bottom:10px}.tutor{width:42px;height:42px;border-radius:12px;background:#1a3041;display:grid;place-items:center;font-size:24px}.lesson-copy{flex:1}.lesson-copy b,.lesson-copy small{display:block}.lesson-copy b{font-size:12px}.lesson-copy small{font-size:9px;color:#8294a5;margin-top:3px}.primary,.secondary,.danger{border-radius:13px;font-weight:700;border:0}.primary{background:linear-gradient(90deg,var(--green),#36e2d6);color:#031018;padding:12px 16px}.secondary{background:#102b3e;color:#d9e8f1;border:1px solid #2b4960;padding:12px}.small{padding:9px 13px;font-size:10px}.full{width:100%;margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.feature{border-radius:15px;padding:13px;text-align:left;color:#fff}.feature .ico{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#12bce7,#574bff);display:grid;place-items:center;margin-bottom:7px}.feature b,.feature small{display:block}.feature b{font-size:11px}.feature small{font-size:9px;color:#8294a5;margin-top:4px}.bottom{position:fixed;bottom:0;width:min(100%,430px);height:70px;padding-bottom:env(safe-area-inset-bottom);background:#04101aee;backdrop-filter:blur(14px);border-top:1px solid #173042;display:grid;grid-template-columns:repeat(4,1fr);z-index:20}.bottom button{border:0;background:none;color:#718696;font-size:9px}.bottom button.active{color:#2ee1c4}.bottom .bi{font-size:19px;display:block;margin-bottom:4px}.header{height:48px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center}.header h1{text-align:center;font-size:17px;margin:0}.icon{background:none;border:0;color:#fff;font-size:22px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#071a28;padding:4px;border-radius:12px;margin:5px 0 14px}.tabs button{border:0;background:none;color:#708595;padding:9px;font-size:10px;border-radius:9px}.tabs .sel{background:#123247;color:#fff}.map{display:flex;align-items:center;gap:12px;min-height:72px;position:relative}.map:not(:last-child):after{content:"";position:absolute;left:19px;top:48px;width:2px;height:35px;background:#244154}.node{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:2px solid #29485c;background:#081725;z-index:1}.done .node{background:#17c68f;border-color:#4ce9bc}.current .node{background:#096ed1;border-color:#29cfff;box-shadow:0 0 22px #008eff77}.copy{flex:1}.copy b,.copy small{display:block}.copy b{font-size:12px}.copy small{font-size:9px;color:#748999;margin-top:3px}.practice{height:52vh;min-height:390px;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 50% 25%,#183b51,#07131e 58%,#04101a);display:flex;align-items:flex-end;justify-content:center;position:relative;border:1px solid var(--line)}.person{font-size:145px;transform:translateY(25px)}.bubble{position:absolute;left:16px;right:16px;bottom:18px;background:#102d40ee;border:1px solid #31516a;border-radius:14px;padding:12px;font-size:12px}.mic{width:76px;height:76px;border-radius:50%;border:2px solid #39d9ff;background:radial-gradient(circle,#1670d5,#0a2746);color:#fff;display:grid;place-items:center;font-size:28px;box-shadow:0 0 35px #008dff66;margin:18px auto}.mic.listen{animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.08)}}.tools{display:flex;justify-content:space-around;color:#8499aa;font-size:9px}.tools span{text-align:center}.word{border-radius:18px;padding:28px 20px;text-align:center;margin:20px 0}.apple{font-size:95px}.word h2{margin:8px 0 3px}.actions{display:flex;justify-content:center;gap:30px;margin-top:15px}.listen{padding:18px;border-radius:18px;margin-top:18px}.listen h3{text-align:center;font-size:13px}.audio{display:grid;place-items:center;margin:18px auto;width:54px;height:54px;border-radius:50%;border:0;background:#102f45;color:#3ed9ff;font-size:22px}.choice{width:100%;margin:7px 0;padding:13px;border-radius:12px;background:#081927;border:1px solid #254154;color:#dce8ef;text-align:left}.choice.good{border-color:#28d9a5;color:#38e5ae;background:#0a2a29}.ach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.ach{padding:12px 7px;border-radius:14px;background:#091b29;border:1px solid #1d3749;text-align:center;min-height:105px}.ach div{font-size:30px}.ach b,.ach small{display:block}.ach b{font-size:9px;margin-top:5px}.ach small{font-size:8px;color:#8295a5;margin-top:4px}.profile{gap:12px;margin:16px 0}.profile>div:nth-child(2){flex:1}.profile h2{margin:0 0 3px;font-size:17px}.level{background:#123451;border-radius:10px;padding:7px 9px;font-size:10px;color:#6ddfff}.bars{height:105px;display:flex;align-items:flex-end;justify-content:space-between;margin-top:14px}.bar{width:9%;background:linear-gradient(180deg,#42e1bb,#177e8f);border-radius:6px 6px 2px 2px;position:relative;min-height:8px}.bar small{position:absolute;top:calc(100% + 6px);font-size:8px;color:#728696;left:50%;transform:translateX(-50%)}.profile-row{padding:13px;border-radius:13px;margin:8px 0;gap:10px}.profile-row span{font-size:18px}.profile-row b{font-size:11px;flex:1}.profile-row small{color:#8093a2;font-size:9px}.hero{border-radius:20px;padding:28px;text-align:center;margin:20px 0}.globe{font-size:55px}.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.topic{padding:18px;border-radius:15px;color:#fff;font-weight:600}.chat{border-radius:18px;padding:14px;margin-top:14px;min-height:390px;display:flex;flex-direction:column}.messages{flex:1;display:flex;flex-direction:column;gap:9px;overflow:auto}.msg{max-width:84%;padding:10px 12px;border-radius:14px;font-size:11px;line-height:1.45}.msg.ai{align-self:flex-start;background:#102d40;border:1px solid #284a61}.msg.me{align-self:flex-end;background:#145c54;border:1px solid #237e78}.chat-input{display:flex;gap:7px;margin-top:8px}.chat-input input{min-width:0;flex:1;background:#06131e;border:1px solid #294356;color:#fff;border-radius:12px;padding:11px;outline:none}.chat-input button{width:44px;border:0;border-radius:12px;background:#20dfa4}.setting{padding:13px;border-radius:14px;display:flex;align-items:center;gap:10px;margin:9px 0}.setting b{font-size:11px;flex:1}.setting small{font-size:9px;color:var(--muted)}.toggle{width:40px;height:23px;border-radius:20px;background:#183042;border:1px solid #2c4b60;position:relative}.toggle:after{content:"";width:17px;height:17px;border-radius:50%;background:#8095a5;position:absolute;top:2px;left:2px}.toggle.on{background:#0e6655}.toggle.on:after{left:19px;background:#20dfa4}.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#102d40;border:1px solid #31516a;padding:11px 14px;border-radius:12px;font-size:11px;z-index:50;display:none}.toast.show{display:block}
</style>
</head>
<body><div class="app"><div class="phone"><div class="status"><span id="clock">09:41</span><span>▮ 4.5G　▰ 68%</span></div><div id="root"></div><nav class="bottom"><button data-go="home"><span class="bi">⌂</span>Ana Sayfa</button><button data-go="lessons"><span class="bi">▣</span>Dersler</button><button data-go="discover"><span class="bi">⌕</span>Keşfet</button><button data-go="profile"><span class="bi">◉</span>Profil</button></nav><div id="toast" class="toast"></div></div></div>
<script>
const key='speakio-state';let state=JSON.parse(localStorage.getItem(key)||'null')||{name:'Ahmet',language:'İngilizce',level:'A2',xp:1250,streak:7,lessons:12,goal:5,done:3,words:120,remembered:[],sound:true};let current='home',wordIndex=0,listenChoice=null;
const words=[['apple','elma','🍎','/ˈæpəl/'],['house','ev','🏠','/haʊs/'],['travel','seyahat','✈️','/ˈtrævəl/'],['friend','arkadaş','🤝','/frend/']];
const go=x=>{current=x;render()};const save=()=>localStorage.setItem(key,JSON.stringify(state));const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)};
function speak(t){if(!state.sound||!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}
function header(t,back=true){return `<div class="header"><button class="icon" onclick="${back?'go(\'home\')':''}">${back?'‹':''}</button><h1>${t}</h1><span></span></div>`}
function btn(t,action,cls='primary full'){return `<button class="${cls}" onclick="${action}()">${t}</button>`}
function home(){return `<main class="screen"><div class="head"><div><h2>Merhaba ${state.name} 👋</h2><div class="muted">Bugün öğrenmeye devam edelim!</div></div><div class="avatar">${state.name[0].toUpperCase()}</div></div><div class="stats"><div class="stat">🔥<b>${state.streak}</b><small>gün seri</small></div><div class="stat">⭐<b>${state.xp.toLocaleString('tr-TR')}</b><small>XP</small></div><div class="stat">👑<b>${state.level}</b><small>Seviye</small></div></div><div class="card"><div class="row"><b>Günlük Hedef</b><span>${state.done}/${state.goal} ders</span></div><div class="progress"><i style="width:${Math.min(100,state.done/state.goal*100)}%"></i></div></div><div class="section"><h3>Bugünün Dersi</h3><button class="link" onclick="go('lessons')">Tümünü Gör</button></div><div class="lesson"><div class="tutor">👩🏻</div><div class="lesson-copy"><b>Selamlaşma</b><small>Temel ifadeleri tanı</small></div>${btn('Devam Et','lesson','primary small')}</div><div class="grid"><button class="feature" onclick="go('speak')"><div class="ico">🎙️</div><b>AI Speak</b><small>Konuşma pratiği</small></button><button class="feature" onclick="go('word')"><div class="ico">📖</div><b>Kelime Hafızası</b><small>${state.words} kelime</small></button><button class="feature" onclick="go('listen')"><div class="ico">🎧</div><b>Dinleme</b><small>Alıştırmaları</small></button><button class="feature" onclick="go('grammar')"><div class="ico">☷</div><b>Dil Bilgisi</b><small>Kısa ve öz</small></button></div></main>`}
function lessons(){let items=[['done','✓','1. Selamlaşma','Temel ifadeler'],['done','✓','2. Kendini Tanıtma','Senin hakkında'],['current','●','3. Sayılar','Sayıları öğren'],['','🔒','4. Aile','Aileni tanıt'],['','🔒','5. Yiyecekler','Günlük yaşam'],['','🔒','6. Ev','Etrafındaki dünya']];return `<main class="screen">${header('İngilizce A1')}<div class="tabs"><button class="sel">Kurs Haritası</button><button>Tüm Dersler</button></div>${items.map(x=>`<div class="map ${x[0]}"><div class="node">${x[1]}</div><div class="copy"><b>${x[2]}</b><small>${x[3]}</small></div></div>`).join('')}</main>`}
function lesson(){return `<main class="screen">${header('Ders',true)}<div class="top-progress"><i style="width:60%"></i></div><div class="lesson-body" style="text-align:center;padding-top:15px"><div class="phrase"><span>🔊</span><b>My name is ${state.name}.</b></div><button class="mic" id="lessonMic">🎙️</button><p>Konuşmak için dokun</p>${btn('Örnek dinle','()=>speak(\'My name is '+state.name+'.\')','secondary full')}</div>${btn('Dersi Tamamla','completeLesson','primary full')}</main>`}
function completeLesson(){state.xp+=50;state.lessons++;state.done=Math.min(state.goal,state.done+1);save();toast('+50 XP 🎉 Ders tamamlandı');go('home')}
function speakScreen(){return `<main class="screen">${header('AI Speak',true)}<div class="practice"><div class="person">👨🏻‍💼</div><div class="bubble">Hi! How was your day?</div></div><button class="mic" id="speakMic">🎙️</button><div class="tools"><span>⌨️<br>Klavye</span><span>🎧<br>Dinle</span><span>💡<br>İpuçları</span></div><div class="card"><b>AI Speak</b><p class="muted">Gerçek bir konuşma yap. Cevabını İngilizce söyle veya aşağıdan yaz.</p></div><div class="chat"><div class="messages">${chat.map(m=>`<div class="msg ${m.who==='ai'?'ai':'me'}">${m.text}</div>`).join('')}</div><div class="chat-input"><input id="chatInput" placeholder="İngilizce yaz..."><button id="send">➤</button></div></div></main>`}
let chat=[{who:'ai',text:'Hi! How was your day?' }];
function sendChat(){const i=document.getElementById('chatInput');if(!i||!i.value.trim())return;const t=i.value.trim();chat.push({who:'me',text:t});let r='Nice! 😊 Can you tell me a little more?';const l=t.toLowerCase();if(l.includes('good')||l.includes('fine'))r='That’s great! What did you do today?';if(l.includes('work'))r='Great! What do you do for work?';if(l.includes('turkey'))r='Turkey sounds interesting! Which city do you live in?';chat.push({who:'ai',text:r});state.xp+=5;save();render();if(state.sound)setTimeout(()=>speak(r),100)}
function listenMic(id,isChat=false){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Tarayıcı ses tanımayı desteklemiyor.');return}const b=document.getElementById(id),r=new SR();r.lang='en-US';r.interimResults=false;r.onstart=()=>b.classList.add('listen');r.onend=()=>b.classList.remove('listen');r.onresult=e=>{const t=e.results[0][0].transcript;if(isChat){chat.push({who:'me',text:t});chat.push({who:'ai',text:'I understood you! Tell me more. 😊'});state.xp+=5;save();render()}else{toast('Duydum: '+t);speak(t)}};r.onerror=()=>toast('Sesini anlayamadım, tekrar dene.');r.start()}
function word(){const w=words[wordIndex];return `<main class="screen">${header('Kelime Hafızası')}<div class="word"><div class="apple">${w[2]}</div><h2>${w[0]}</h2><small class="muted">${w[3]}</small><p>${w[1]}</p><div class="actions"><button class="icon" onclick="speak('${w[0]}')">🔊</button><button class="icon" onclick="rememberWord()">${state.remembered.includes(w[0])?'★':'☆'}</button></div></div>${btn('Biliyorum','wordKnown','primary full')}${btn('Tekrar Göster','wordAgain','secondary full')}</main>`}
function rememberWord(){const w=words[wordIndex][0];state.remembered.includes(w)?state.remembered=state.remembered.filter(x=>x!==w):state.remembered.push(w);save();render()};function wordKnown(){state.xp+=10;state.words++;state.level=state.xp>=1500?'B1':'A2';wordIndex=(wordIndex+1)%words.length;save();toast('+10 XP • Yeni kelime');render()};function wordAgain(){wordIndex=(wordIndex+1)%words.length;render()}
function listen(){return `<main class="screen">${header('Dinleme Alıştırması')}<div class="listen"><h3>Duyduğunu seç</h3><button class="audio" onclick="speak('car')">🔊</button>${['cat','car','cup'].map((x,i)=>`<button class="choice ${listenChoice===i?'good':''}" onclick="listenChoice=${i};render()">${String.fromCharCode(97+i)}) ${x}</button>`).join('')}${btn('Kontrol Et','checkListen','primary full')}</div></main>`};function checkListen(){if(listenChoice===1){state.xp+=20;state.done=Math.min(state.goal,state.done+1);save();toast('Doğru! +20 XP 🎧')}else toast('Bir kez daha dinle ve dene.');listenChoice=null;render()}
function achievements(){return `<main class="screen">${header('Başarılar')}<div class="ach-grid">${[['🔥','7 Gün Seri',state.streak+' gün'],['⭐','İlk Ders','Tamamlandı'],['🏅','Kelime Ustası',state.words+' kelime'],['🎤','Konuşmaya Başla','10 konuşma'],['🎧','Dinleme Uzmanı','20 alıştırma'],['🏆','Seviye Atla',state.level]].map(x=>`<div class="ach"><div>${x[0]}</div><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div></main>`}
function profile(){return `<main class="screen">${header('Profil',false)}<div class="profile"><div class="big-avatar">${state.name[0].toUpperCase()}</div><div><h2>${state.name}</h2><p class="muted">${state.language} öğreniyor</p></div><b class="level">${state.level}</b></div><div class="stats"><div class="stat">🔥<b>${state.streak}</b><small>gün seri</small></div><div class="stat">⭐<b>${state.xp.toLocaleString('tr-TR')}</b><small>XP</small></div><div class="stat">📚<b>${state.lessons}</b><small>tamamlanan ders</small></div></div><div class="card"><b>Haftalık İlerleme</b><div class="bars">${[30,50,52,75,58,70,20].map((h,i)=>`<div class="bar" style="height:${h}%"><small>${['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'][i]}</small></div>`).join('')}</div></div><div class="profile-row" onclick="go('word')"><span>📖</span><b>Kelimelerim</b><small>${state.words} kelime</small><span>›</span></div><div class="profile-row" onclick="go('achievements')"><span>🏆</span><b>Başarılar</b><small>Rozetlerini gör</small><span>›</span></div><div class="profile-row" onclick="go('settings')"><span>⚙️</span><b>Ayarlar</b><span>›</span></div></main>`}
function discover(){return `<main class="screen">${header('Keşfet',false)}<div class="hero"><div class="globe">🌍</div><h2>Dünyayı konuş</h2><p class="muted">Gerçek hayat konularıyla İngilizceni geliştir.</p></div><div class="topic-grid">${['✈️ Seyahat','🍔 Yemek','💼 İş','🎬 Eğlence','🏠 Günlük Hayat','🌍 Kültür'].map(t=>`<button class="topic">${t}</button>`).join('')}</div><div class="card"><b>🔥 Bugünün konuşma konusu</b><p class="muted">Bir kafede sipariş ver. AI öğretmenin seni yönlendirsin.</p>${btn('Konuşmayı Başlat','speakScreen','primary full')}</div></main>`}
function grammar(){return `<main class="screen">${header('Dil Bilgisi')}<div class="card"><h3>Present Simple</h3><p class="muted">Günlük rutinlerden ve alışkanlıklardan bahsederken kullanılır.</p><div class="phrase" style="margin-top:12px"><b>I work every day.</b></div><p class="muted" style="margin:10px 0 0">Ben her gün çalışırım.</p></div>${btn('Örneği Dinle','()=>speak(\'I work every day.\')','secondary full')}${btn('Kısa Test','listen','primary full')}</main>`}
function settings(){return `<main class="screen">${header('Ayarlar')}<div class="setting"><span>🔊</span><b>Sesler</b><small>${state.sound?'Açık':'Kapalı'}</small><button class="toggle ${state.sound?'on':''}" onclick="state.sound=!state.sound;save();render()"></button></div><div class="setting"><span>👤</span><b>Profil adı</b><button class="secondary small" onclick="editName()">Değiştir</button></div><div class="setting"><span>🌍</span><b>Öğrenme dili</b><small>${state.language}</small></div><div class="card"><b>Speakio</b><p class="muted" style="margin-top:6px">Konuşarak Dil Öğren • MVP</p></div><button class="danger full" style="background:#2b111b;color:#ff91a2;border:1px solid #5b2232" onclick="resetApp()">İlerlemeyi Sıfırla</button></main>`}
function editName(){const n=prompt('Profil adın',state.name);if(n&&n.trim()){state.name=n.trim();save();render()}}function resetApp(){if(confirm('Tüm ilerleme sıfırlansın mı?')){localStorage.removeItem(key);location.reload()}}
function render(){const screens={home,lessons,lesson,speak:speakScreen,word,listen,achievements,profile,discover,grammar,settings};document.getElementById('root').innerHTML=(screens[current]||home)();document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.go===current));const lm=document.getElementById('lessonMic');if(lm)lm.onclick=()=>listenMic('lessonMic');const sm=document.getElementById('speakMic');if(sm)sm.onclick=()=>listenMic('speakMic',true);const send=document.getElementById('send');if(send)send.onclick=sendChat;const input=document.getElementById('chatInput');if(input)input.addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});}
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}),1000);render();
</script></body></html>
