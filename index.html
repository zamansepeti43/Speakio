<style>
:root{--bg:#02070d;--surface:#071522;--surface2:#0b1e2e;--surface3:#102b3e;--line:#173448;--text:#f4f8fc;--muted:#8195a5;--cyan:#31d9ff;--blue:#2785ff;--green:#28e2a5;--purple:#7656ff;--pink:#b14cff;--red:#ff6680;--shadow:0 20px 60px #0009}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#01050a;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow-x:hidden}button,input{font:inherit}button{cursor:pointer;color:inherit}.app{min-height:100vh;display:flex;justify-content:center;background:radial-gradient(circle at 50% -5%,#12334b 0,#02070d 42%)}.phone{width:100%;max-width:430px;min-height:100vh;position:relative;background:linear-gradient(180deg,#06121f 0,#03101a 100%);box-shadow:0 0 90px #000;overflow:hidden}.status{height:32px;padding:8px 17px 0;font-size:11px;display:flex;justify-content:space-between;color:#d5e0e8}.screen{min-height:calc(100vh - 32px);padding:13px 18px 92px;animation:in .18s ease}@keyframes in{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}h1,h2,h3,p{margin:0}.muted{color:var(--muted);font-size:11px}.head,.row,.section,.profile-head,.lesson,.feature,.profile-line{display:flex;align-items:center}.head{justify-content:space-between;margin:7px 0 17px}.head h2{font-size:20px;line-height:1.15;margin-bottom:5px}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#1bd8ee,#7651ff);font-weight:800;box-shadow:0 0 20px #315fff55}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat,.card,.lesson,.feature,.word-card,.listen-card,.achievement,.profile-card,.topic,.chat,.setting,.daily-card,.welcome{background:linear-gradient(145deg,#0b2030,#071521);border:1px solid var(--line);box-shadow:inset 0 1px #ffffff0d}.stat{border-radius:14px;padding:10px 7px;text-align:center}.stat .emoji{font-size:18px}.stat b{display:block;font-size:15px;margin:4px}.stat small{font-size:9px;color:#8297a8}.c .bottom button.active{color:#32e1c1}.bi{font-size:19px;display:block;margin-bottom:4px}.header{height:48px;display:grid;grid-template-columns:42px 1fr 42px;align-items:center}.header h1{text-align:center;font-size:17px}.icon{background:none;border:0;font-size:28px;line-height:1}.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:#071a28;border-radius:12px;margin:3px 0 15px}.tabs button{border:0;background:none;color:#728696;padding:9px;border-radius:9px;font-size:10px}.tabs .sel{background:#123247;color:#fff}.map{display:flex;align-items:center;gap:12px;min-height:70px;position:relative}.map:not(:last-child):after{content:"";position:absolute;left:19px;top:48px;width:2px;height:34px;background:#244052}.node{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:2px solid #2a4558;background:#081725;z-index:1}.done .node{background:#18c991;border-color:#4be9b9}.current .node{background:#0876db;border-color:#2ed3ff;box-shadow:0 0 23px #008dff77}.copy{flex:1}.copy b,.copy small{display:block}.copy b{font-size:12px}.copy small{font-size:9px;color:#728898;margin-top:3px}.tag{font-size:8px;padding:4px 7px;border-radius:8px;background:#102d40;color:#65ddff}.practice{height:49vh;min-height:365px;border-radius:21px;overflow:hidden;position:relative;border:1px solid #1a3a4d;background:radial-gradient(circle at 50% 15%,#1d4a62,#0a1a27 48%,#04101a 82%);display:flex;align-items:flex-end;justify-content:center}.practice:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#22cfff16;filter:blur(35px);top:40px}.person{font-size:145px;z-index:1;transform:translateY(25px);filter:drop-shadow(0 12px 18px #0009)}.bubble{position:absolute;z-index:2;left:15px;right:15px;bottom:17px;background:#102c3fee;border:1px solid #31536a;border-radius:15px;padding:12px 13px;font-size:12px;box-shadow:0 12px 30px #0008}.mic{width:78px;height:78px;border-radius:50%;border:2px solid #3bdcff;background:radial-gradient(circle,#1879dc,#082a4a);color:white;display:grid;place-items:center;font-size:29px;margin:17px auto;box-shadow:0 0 36px #008eff70}.mic.listening{animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 50px #00cfffaa}}.tools{display:flex;justify-content:space-around;color:#8297a7;font-size:9px;margin-top:2px}.tools span{text-align:center}.tools b{display:block;font-size:18px;margin-bottom:4px}.phrase{background:#f4f8fc;color:#12202b;border-radius:15px;padding:16px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;margin:15px 0}.phrase button{margin-left:auto;border:0;background:none;color:#176184;font-size:19px}.result{border-radius:17px;background:linear-gradient(145deg,#102c3e,#0a1e2b);border:1px solid #31546a;padding:14px;margin-top:10px}.result-top{display:flex;gap:10px;align-items:center}.result-avatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#6fd4ff,#8a58ff);font-size:30px}.result b{font-size:13px}.good{color:#38e5ad}.correction{margin-top:12px;font-size:10px;color:#a9bdc9}.correction strong{display:block;color:#41e4ae;font-size:12px;margin-top:4px}.word-card{border-radius:19px;padding:26px 20px;text-align:center;margin:17px 0}.apple{font-size:92px;line-height:1}.word-card h2{font-size:25px;margin:10px 0 3px}.pron{font-size:10px;color:#7e95a6}.meaning{font-size:12px;color:#d7e5ed;margin-top:8px}.actions{display:flex;justify-content:center;gap:35px;margin:13px}.circle-action{border:0;background:none;font-size:23px}.listen-card{border-radius:19px;padding:18px;margin-top:14px}.listen-card h3{text-align:center;font-size:14px}.audio{width:58px;height:58px;border:0;border-radius:50%;background:#10314a;color:#39d9ff;display:grid;place-items:center;margin:17px auto;font-size:22px}.choice{width:100%;border-radius:12px;background:#081a28;border:1px solid #274356;color:#dce8ef;text-align:left;padding:12px;margin:6px 0;font-size:11px}.choice.selected{border-color:#29dda7;background:#0a2b29;color:#3fe4ad}.choice.wrong{border-color:#ff637b;background:#311725;color:#ff8093}.ach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.achievement{border-radius:14px;min-height:108px;text-align:center;padding:11px 5px}.achievement .badge{font-size:30px}.achievement b,.achievement small{display:block}.achievement b{font-size:9px;margin-top:5px}.achievement small{font-size:8px;color:#7f93a2;margin-top:4px}.locked{opacity:.45;filter:grayscale(.6)}.profile-head{gap:12px;margin:15px 0}.big-avatar{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#22d9ee,#7752ff);font-size:24px;font-weight:800}.profile-info{flex:1}.profile-info h2{font-size:18px;margin-bottom:3px}.level{background:#123451;color:#64dcff;border-radius:9px;padding:5px 8px;font-size:9px}.profile-card{border-radius:17px;padding:14px;margin:12px 0}.bars{height:102px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 4px;margin-top:10px}.bar{width:9%;min-height:9px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#4ae4bc,#177d8d);position:relative}.bar small{position:absolute;top:calc(100% + 7px);font-size:8px;color:#738797;left:50%;transform:translateX(-50%)}.profile-line{gap:10px;padding:13px;border-radius:13px;margin:8px 0;background:linear-gradient(145deg,#0b2030,#071521);border:1px solid var(--line)}.profile-line .li{font-size:19px}.profile-line b{flex:1;font-size:11px}.profile-line small{font-size:9px;color:#7f93a2}.chev{color:#68808f;font-size:18px}.welcome{border-radius:21px;padding:26px 18px;text-align:center;margin:17px 0}.globe{font-size:62px;filter:drop-shadow(0 0 22px #18dfff55)}.welcome h2{font-size:23px;margin:8px 0}.welcome p{font-size:10px;color:#8499aa}.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.topic{border-radius:15px;padding:16px;border:1px solid var(--line);font-size:12px}.topic span{font-size:24px;display:block;margin-bottom:7px}.chat{border-radius:19px;padding:13px;min-height:405px;display:flex;flex-direction:column;margin-top:13px}.messages{flex:1;display:flex;flex-direction:column;gap:8px;overflow:auto}.msg{max-width:85%;padding:10px 12px;border-radius:14px;font-size:11px;line-height:1.45}.msg.ai{align-self:flex-start;background:#102d40;border:1px solid #284c62}.msg.me{align-self:flex-end;background:#145a51;border:1px solid #237b70}.chat-input{display:flex;gap:7px;margin-top:9px}.chat-input input{min-width:0;flex:1;border-radius:12px;border:1px solid #294558;background:#06131f;color:#fff;padding:11px;outline:none}.chat-input button{width:44px;border:0;border-radius:12px;background:#20dfa4;color:#021017;font-weight:900}.setting{border-radius:14px;padding:13px;display:flex;align-items:center;gap:10px;margin:9px 0}.setting b{flex:1;font-size:11px}.setting small{font-size:9px;color:var(--muted)}.toggle{width:41px;height:24px;border-radius:20px;background:#183042;border:1px solid #2c4b60;position:relative}.toggle:after{content:"";position:absolute;width:18px;height:18px;top:2px;left:2px;border-radius:50%;background:#8297a5;transition:.2s}.toggle.on{background:#0e6655}.toggle.on:after{left:19px;background:#20dfa4}.toast{position:fixed;z-index:60;left:50%;bottom:82px;transform:translateX(-50%);background:#102d40;border:1px solid #31536a;padding:10px 14px;border-radius:12px;font-size:10px;display:none;white-space:nowrap;box-shadow:0 12px 30px #0008}.toast.show{display:block}.splash{min-height:calc(100vh - 32px);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;text-align:center;background:radial-gradient(circle at 50% 25%,#10465d 0,#06131f 35%,#02070d 75%)}.logo-orb{width:142px;height:142px;border-radius:44px;background:linear-gradient(145deg,#21e5e8,#7b45ff);display:grid;place-items:center;box-shadow:0 0 65px #16dfff55,0 25px 55px #0008;position:relative}.logo-orb:after{content:"";position:absolute;inset:17px;border:2px solid #ffffff88;border-radius:34px}.wave{font-size:57px;z-index:1}.splash h1{font-size:40px;margin:20px 0 5px;letter-spacing:-1px}.splash p{font-size:13px;color:#b7c8d2}.earth{font-size:100px;margin:28px 0 14px;filter:drop-shadow(0 0 35px #00cfff66)}.splash .primary{width:100%;max-width:300px}.login{margin-top:14px;border:0;background:none;color:#9db0bc;font-size:11px}.subtle{font-size:9px;color:#6f8494;text-align:center;margin-top:13px}
@media(min-width:700px){.app{padding:24px}.phone{border-radius:30px;min-height:900px}.bottom{position:absolute;border-radius:0 0 30px 30px}.status{border-radius:30px 30px 0 0}}

<body>
<div class="app"><div class="phone"><div class="status"><span id="clock">09:41</span><span>▮ 4.5G　▰ 68%</span></div><div id="root"></div><nav class="bottom"><button data-go="home"><span class="bi">⌂</span>Ana Sayfa</button><button data-go="lessons"><span class="bi">▣</span>Dersler</button><button data-go="discover"><span class="bi">⌕</span>Keşfet</button><button data-go="profile"><span class="bi">◉</span>Profil</button></nav><div id="toast" class="toast"></div></div></div>
<script>
const KEY='speakio-state-v2';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{name:'Ahmet',language:'İngilizce',level:'A2',xp:1250,streak:7,lessons:12,goal:5,done:3,words:120,remembered:[],sound:true,autoVoice:true};
let current='home',wordIndex=0,listenChoice=null,recognition=null,chat=[];
const words=[['apple','elma','🍎','/ˈæpəl/'],['house','ev','🏠','/haʊs/'],['travel','seyahat','✈️','/ˈtrævəl/'],['friend','arkadaş','🤝','/frend/']];
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const go=x=>{current=x;render()};
const toast=t=>{let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)};
function speak(t){if(!state.sound||!('speechSynthesis'in window))return;let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.92;speechSynthesis.cancel();speechSynthesis.speak(u)}
function header(t,back=true){return `<div class="header"><button class="icon" onclick="${back?"go('home')":""}">${back?'‹':''}</button><h1>${t}</h1><span></span></div>`}
function button(t,fn,cls='primary full'){return `<button class="${cls}" onclick="${fn}()">${t}</button>`}
function home(){return `<main class="screen"><div class="head"><div><h2>Merhaba ${state.name} 👋</h2><div class="muted">Bugün öğrenmeye devam edelim!</div></div><div class="avatar">${state.name[0].toUpperCase()}</div></div><div class="stats"><div class="stat"><span class="emoji">🔥</span><b>${state.streak}</b><small>gün seri</small></div><div class="stat"><span class="emoji">⭐</span><b>${state.xp.toLocaleString('tr-TR')}</b><small>XP</small></div><div class="stat"><span class="emoji">👑</span><b>${state.level}</b><small>Seviye</small></div></div><div class="card"><div class="row"><b>Günlük Hedef</b><span>${state.done}/${state.goal} ders</span></div><div class="progress"><i style="width:${Math.min(100,state.done/state.goal*100)}%"></i></div></div><div class="section"><h3>Bugünün Dersi</h3><button class="link" onclick="go('lessons')">Tüm Dersler</button></div><div class="lesson"><div class="tutor">👩🏻‍🏫</div><div class="lesson-copy"><b>Selamlaşma</b><small>Temel ifadeleri tanı</small></div>${button('Devam Et','lesson','primary small')}</div><div class="grid"><button class="feature" onclick="go('speak')"><div class="ico">🎙️</div><b>AI Speak</b><small>Konuşma pratiği</small></button><button class="feature" onclick="go('word')"><div class="ico">📖</div><b>Kelime Hafızası</b><small>${state.words} kelime</small></button><button class="feature" onclick="go('listen')"><div class="ico">🎧</div><b>Dinleme</b><small>Alıştırmaları</small></button><button class="feature" onclick="go('grammar')"><div class="ico">☷</div><b>Dil Bilgisi</b><small>Kısa ve öz</small></button></div><div class="section"><h3>Hızlı Başlangıç</h3></div><div class="daily-card card"><div class="row"><b>🔥 7 günlük seriyi koru</b><span class="tag">BUGÜN</span></div><div class="muted" style="margin-top:7px">10 dakika konuşma pratiği yap ve serini devam ettir.</div></div></main>`}
function lessons(){let items=[['done','✓','1. Selamlaşma','Temel ifadeler'],['done','✓','2. Kendini Tanıtma','Senin hakkında'],['current','●','3. Sayılar','Sayıları öğren'],['locked','🔒','4. Aile','Aileni tanıt'],['locked','🔒','5. Yiyecekler','Günlük yaşam'],['locked','🔒','6. Ev','Etrafındaki dünya']];return `<main class="screen">${header('İngilizce A1')}<div class="tabs"><button class="sel">Kurs Haritası</button><button onclick="go('discover')">Tüm Dersler</button></div>${items.map(x=>`<div class="map ${x[0]}"><div class="node">${x[1]}</div><div class="copy"><b>${x[2]}</b><small>${x[3]}</small></div>${x[0]==='current'?'<span class="tag">DEVAM</span>':''}</div>`).join('')}<div class="card"><div class="row"><b>A1 İlerlemesi</b><span>42%</span></div><div class="progress"><i style="width:42%"></i></div></div></main>`}
function lesson(){return `<main class="screen">${header('Selamlaşma')}<div class="row"><span class="muted">Ders 1 / 5</span><span class="tag">+20 XP</span></div><div class="phrase"><span>🔊</span><span>My name is Ahmet.</span><button onclick="speak('My name is Ahmet.')">◖</button></div><div class="card"><b style="font-size:13px">Bu ifadeyi tekrar et</b><div class="muted" style="margin-top:5px">Mikrofona dokun ve İngilizce söyle.</div><button class="mic" id="lessonMic">🎙️</button><div class="muted" style="text-align:center">Konuşmak için dokun</div><button class="secondary full" onclick="speak('My name is Ahmet.')">🔊 Örnek dinle</button></div>${button('Devam Et','finishLesson','primary full')}</main>`}
function finishLesson(){state.done=Math.min(state.goal,state.done+1);state.xp+=20;state.lessons+=1;save();go('feedback')}
function feedback(){return `<main class="screen">${header('3 / 5')}<div class="practice" style="height:42vh;min-height:320px"><div class="person">👩🏻</div><div class="bubble">My name is Ahmet.</div></div><div class="result"><div class="result-top"><div class="result-avatar">👩🏻</div><div><b class="good">✓ Harika!</b><div class="muted">Doğru söyledin.</div></div></div><div class="correction">Daha doğal bir ifade:<strong>“Nice to meet you, Ahmet.”</strong></div></div>${button('Devam Et','goSpeak','primary full')}</main>`}
function goSpeak(){go('speak')}
function speakScreen(){if(!chat.length)chat=[['ai','Hi! How was your day?']];return `<main class="screen">${header('AI Speak')}<div class="practice"><div class="person">👨🏻‍💼</div><div class="bubble">${chat[chat.length-1][1]}</div></div><button class="mic" id="speakMic">🎙️</button><div class="tools"><span><b>⌨️</b>Klavye</span><span><b>🔊</b>Dinle</span><span><b>💡</b>İpucu</span></div><div class="chat" style="min-height:170px;margin-top:14px"><div class="messages">${chat.map(m=>`<div class="msg ${m[0]=='ai'?'ai':'me'}">${m[1]}</div>`).join('')}</div><div class="chat-input"><input id="chatInput" placeholder="İngilizce cevap yaz..."><button id="send">➤</button></div></div></main>`}
function listenMic(id){let el=document.getElementById(id);if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){toast('Bu tarayıcı ses tanımayı desteklemiyor.');return}let R=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new R();recognition.lang='en-US';recognition.interimResults=false;el.classList.add('listening');recognition.onresult=e=>{let text=e.results[0][0].transcript;el.classList.remove('listening');if(current==='lesson'){toast('Duydum: '+text);finishLesson()}else{chat.push(['me',text]);setTimeout(()=>{chat.push(['ai',text.toLowerCase().includes('good')?'Great! Tell me more.':'Nice! Try saying: “My day was good.”']);render();speak(chat[chat.length-1][1])},300);render()}};recognition.onerror=()=>{el.classList.remove('listening');toast('Mikrofon kullanılamadı.');};recognition.onend=()=>el.classList.remove('listening');recognition.start()}
function sendChat(){let i=document.getElementById('chatInput');if(!i||!i.value.trim())return;let t=i.value.trim();chat.push(['me',t]);i.value='';let reply=t.toLowerCase().includes('good')?'That’s great! What did you do today?':'Nice! A more natural sentence is: “My day was good.”';chat.push(['ai',reply]);render();setTimeout(()=>speak(reply),150)}
function word(){let w=words[wordIndex%words.length];return `<main class="screen">${header('Kelime Hafızası')}<div class="row"><span class="muted">Kelime ${wordIndex+1} / ${words.length}</span><span class="tag">${state.words} kelime</span></div><div class="word-card"><div class="apple">${w[2]}</div><h2>${w[0]}</h2><div class="pron">${w[3]}</div><div class="meaning">${w[1]}</div><div class="actions"><button class="circle-action" onclick="speak('${w[0]}')">🔊</button><button class="circle-action" onclick="rememberWord()">${state.remembered.includes(w[0])?'⭐':'☆'}</button></div></div>${button('Biliyorum','nextWord','primary full')}${button('Tekrar Göster','repeatWord','secondary full')}</main>`}
function nextWord(){wordIndex++;state.xp+=5;save();render()}function repeatWord(){let w=words[wordIndex%words.length];speak(w[0]);toast('Tekrar dinletiliyor')}function rememberWord(){let w=words[wordIndex%words.length];if(!state.remembered.includes(w[0]))state.remembered.push(w[0]);save();toast('Kelime kaydedildi ⭐');render()}
function listen(){let opts=['cat','car','cup'];return `<main class="screen">${header('Dinleme Alıştırması')}<div class="listen-card"><h3>Duyduğunu seç</h3><button class="audio" onclick="speak('car')">🔊</button><div class="muted" style="text-align:center">Sesi dinlemek için dokun</div>${opts.map(x=>`<button class="choice ${listenChoice===x?(x==='car'?'selected':'wrong'):''}" onclick="chooseListen('${x}')">${x==='cat'?'a)':x==='car'?'b)':'c)'} ${x}</button>`).join('')}</div>${button('Kontrol Et','checkListen','primary full')}</main>`}
function chooseListen(x){listenChoice=x;render()}function checkListen(){if(listenChoice==='car'){state.xp+=10;save();toast('Doğru! +10 XP 🎉')}else toast('Tekrar dinle ve dene.');render()}
function achievements(){let a=[['🔥','7 Gün Seri','7 gün üst üste'],['⭐','İlk Ders','Tamamlandı'],['🏅','Kelime Ustası','50 kelime'],['🗣️','Konuşmaya Başla','10 konuşma'],['🎧','Dinleme Uzmanı','20 alıştırma'],['👑','Seviye Atla','A2’ye ulaş']];return `<main class="screen">${header('Başarılar')}<div class="ach-grid">${a.map((x,i)=>`<div class="achievement ${i>2?'locked':''}"><div class="badge">${x[0]}</div><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div><div class="card" style="margin-top:15px"><div class="row"><b>🏆 Hedefine çok yaklaştın!</b><span>5/6</span></div><div class="progress"><i style="width:83%"></i></div></div></main>`}
function profile(){return `<main class="screen">${header('Profil',false)}<div class="profile-head"><div class="big-avatar">${state.name[0].toUpperCase()}</div><div class="profile-info"><h2>${state.name}</h2><div class="muted">${state.language} öğreniyor</div></div><span class="level">${state.level}</span></div><div class="stats"><div class="stat"><span class="emoji">🔥</span><b>${state.streak}</b><small>gün seri</small></div><div class="stat"><span class="emoji">⭐</span><b>${state.xp.toLocaleString('tr-TR')}</b><small>XP</small></div><div class="stat"><span class="emoji">📚</span><b>${state.lessons}</b><small>tamamlanan ders</small></div></div><div class="profile-card"><div class="row"><b>Haftalık İlerleme</b><span class="muted">Bu hafta</span></div><div class="bars">${[35,60,58,78,65,82,42].map((h,i)=>`<div class="bar" style="height:${h}%"><small>${'P S Ç P C C P'.split(' ')[i]}</small></div>`).join('')}</div></div><div class="profile-line" onclick="go('word')"><span class="li">📖</span><b>Kelimelerim</b><small>${state.words} kelime</small><span class="chev">›</span></div><div class="profile-line" onclick="go('achievements')"><span class="li">🏆</span><b>Başarılar</b><small>3 / 6</small><span class="chev">›</span></div><div class="profile-line" onclick="go('settings')"><span class="li">⚙️</span><b>Ayarlar</b><span class="chev">›</span></div></main>`}
function discover(){return `<main class="screen">${header('Keşfet',false)}<div class="welcome"><div class="globe">🌍</div><h2>Dünyayı konuş.</h2><p>İlgi alanına göre pratik yap, gerçek hayattaki cümleleri öğren.</p></div><div class="section"><h3>Konular</h3></div><div class="topic-grid"><button class="topic" onclick="startTopic('Seyahat')"><span>✈️</span>Seyahat</button><button class="topic" onclick="startTopic('İş')"><span>💼</span>İş Hayatı</button><button class="topic" onclick="startTopic('Günlük')"><span>☕</span>Günlük Hayat</button><button class="topic" onclick="startTopic('Restoran')"><span>🍽️</span>Restoran</button></div><div class="section"><h3>AI ile Konuş</h3></div><div class="card"><b style="font-size:12px">🎙️ Gerçek konuşma senaryoları</b><div class="muted" style="margin-top:5px">Havaalanı, otel, iş görüşmesi ve daha fazlası.</div>${button('AI Speak’i Aç','goSpeak','primary full')}</div></main>`}
function startTopic(t){chat=[['ai',`Let’s practice ${t.toLowerCase()} English! Where would you like to start?`]];go('speak')}
function grammar(){return `<main class="screen">${header('Dil Bilgisi')}<div class="card"><h3 style="font-size:14px">Present Simple</h3><div class="muted" style="margin-top:6px">Günlük rutinleri ve genel doğruları anlatmak için kullanılır.</div><div class="phrase" style="margin-top:12px;margin-bottom:0">I work every day.</div></div><div class="card"><b style="font-size:12px">Mini kural</b><p class="muted" style="margin-top:7px">I / You / We / They → work<br>He / She / It → works</p></div>${button('Pratik Yap','goSpeak','primary full')}</main>`}
function settings(){return `<main class="screen">${header('Ayarlar')}<div class="setting"><b>Sesler</b><small>Öğrenme sesleri</small><button class="toggle ${state.sound?'on':''}" onclick="state.sound=!state.sound;save();render()"></button></div><div class="setting"><b>Otomatik seslendirme</b><small>AI cevaplarını oku</small><button class="toggle ${state.autoVoice?'on':''}" onclick="state.autoVoice=!state.autoVoice;save();render()"></button></div><div class="setting" onclick="changeName()"><b>Profil adı</b><small>${state.name}</small><span class="chev">›</span></div><div class="setting"><b>Öğrenme dili</b><small>🇬🇧 İngilizce</small><span class="chev">›</span></div><div class="card"><b style="font-size:12px">Speakio A1</b><div class="muted" style="margin-top:5px">Konuşarak öğrenme deneyimin hazır.</div></div></main>`}
function changeName(){let n=prompt('Adın',state.name);if(n&&n.trim()){state.name=n.trim();save();render()}}
function splash(){return `<main class="splash"><div class="logo-orb"><div class="wave">◖▮▮▮◗</div></div><h1>Speakio</h1><p>Konuşarak Dil Öğren</p><div class="earth">🌍</div>${button('Başla','startApp','primary') }<button class="login" onclick="startApp()">Giriş Yap</button><div class="subtle">Her gün 10 dakika. Daha çok konuş. Daha hızlı öğren.</div></main>`}
function startApp(){current='home';render()}
function render(){const screens={splash,home,lessons,lesson,feedback,speak:speakScreen,word,listen,achievements,profile,discover,grammar,settings};document.getElementById('root').innerHTML=(screens[current]||home)();document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.go===current));let lm=document.getElementById('lessonMic');if(lm)lm.onclick=()=>listenMic('lessonMic');let sm=document.getElementById('speakMic');if(sm)sm.onclick=()=>listenMic('speakMic');let send=document.getElementById('send');if(send)send.onclick=sendChat;let input=document.getElementById('chatInput');if(input)input.addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});}
// İlk açılışta uygulama ekranını göster; splash tekrar görülsün isteyen kullanıcı için localStorage temizlenebilir.
render();setInterval(()=>{let c=document.getElementById('clock');if(c)c.textContent=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})},1000);
</script>
</body></html>
